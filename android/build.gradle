allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// Some plugins (flutter_native_splash) still compile against an old Android
// API, which AGP 9 rejects because their AndroidX dependencies need a newer
// one. Compile every plugin against the app's SDK instead. Registered before
// evaluationDependsOn below, which evaluates the projects.
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library")) {
            project.android.compileSdk = 37
            project.android.buildToolsVersion = "37.0.0"
            // Native plugins (jni) otherwise ask for AGP's default CMake,
            // which the read-only Nix SDK doesn't ship.
            if (project.android.externalNativeBuild.cmake.path != null) {
                project.android.externalNativeBuild.cmake.version = "4.1.2"
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
