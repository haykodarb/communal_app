flutter_launcher_icons:
  # Android uses hand-made vector drawables (android/app/src/main/res:
  # mipmap-anydpi-v26/launcher_icon.xml), traced from assets/new.png.
  android: false
  ios: true
  image_path: "assets/new.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_foreground_inset: 10
  web:
    generate: true
    image_path: "assets/new.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
